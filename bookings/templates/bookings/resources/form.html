{% extends "bookings/base.html" %}

{% block bookings_title %}{{ title }}{% endblock %}

{% block bookings_content %}
<div class="max-w-2xl mx-auto">
    <div class="card bg-base-100 shadow-sm border border-base-200">
        <div class="card-body">
            <h2 class="card-title text-xl mb-4">{{ title }}</h2>
            
            <form method="post">
                {% csrf_token %}
                
                {% for field in form %}
                <div class="form-control w-full mb-4">
                    <label class="label cursor-pointer justify-start gap-4" for="{{ field.id_for_label }}">
                        <span class="label-text font-medium min-w-[120px]">{{ field.label }}</span>
                        {{ field }}
                    </label>
                    {% if field.help_text %}
                    <label class="label">
                        <span class="label-text-alt text-base-content/60 ml-[136px]">{{ field.help_text }}</span>
                    </label>
                    {% endif %}
                    {% if field.errors %}
                    <label class="label">
                        <span class="label-text-alt text-error ml-[136px]">{{ field.errors.0 }}</span>
                    </label>
                    {% endif %}
                </div>
                {% endfor %}
                
                <div class="mt-8 flex justify-end gap-2">
                    <a href="{% url 'bookings:resource_list' %}" class="btn btn-ghost">Cancel</a>
                    <button type="submit" class="btn btn-primary">Save Resource</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
