<dialog id="quotation_send_modal" class="modal modal-bottom sm:modal-middle" open>
    <div class="modal-box bg-base-100 border border-base-300 shadow-xl rounded-2xl max-w-lg">
        <div class="flex items-center justify-between mb-6">
            <h3 class="font-bold text-xl text-primary flex items-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
                </svg>
                Send Quotation
            </h3>
            <button class="btn btn-sm btn-circle btn-ghost" onclick="closeSendModal()">✕</button>
        </div>

        <form method="POST" action="{% url 'sales:quotation_detail' quote.pk %}" 
              hx-post="{% url 'sales:quotation_detail' quote.pk %}" 
              hx-target="body"
              class="space-y-4" 
              onsubmit="setTimeout(closeSendModal, 300)">
            {% csrf_token %}
            <input type="hidden" name="action" value="send">
            
            <p class="text-base-content/80">
                Are you sure you want to send this quotation to <strong>{{ quote.customer.name }}</strong>?
            </p>
            
            <div class="bg-base-200 p-4 rounded-lg text-sm">
                <ul class="list-disc list-inside space-y-1">
                    <li><strong>Total Amount:</strong> ₹{{ quote.total_amount }}</li>
                    <li><strong>Customer Email:</strong> {{ quote.customer.email|default:"Not Provided (will print)" }}</li>
                </ul>
            </div>
            
            <div class="alert alert-info shadow-sm py-2">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" class="stroke-current shrink-0 w-5 h-5"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                <span>This will lock the quotation from further edits.</span>
            </div>

            <div class="modal-action mt-6 flex gap-2">
                <button type="button" class="btn btn-ghost flex-1" onclick="closeSendModal()">Cancel</button>
                <button type="submit" class="btn btn-primary flex-1">Mark as Sent</button>
            </div>
        </form>
    </div>
</dialog>

<script>
    function closeSendModal() {
        const modal = document.getElementById('quotation_send_modal');
        if (modal) {
            modal.removeAttribute('open');
            setTimeout(() => modal.remove(), 200);
        }
    }
</script>
