<dialog id="pos_checkout_modal" class="modal modal-bottom sm:modal-middle" open>
    <div class="modal-box bg-base-100 border border-base-300 shadow-xl rounded-2xl max-w-sm text-center">
        <h3 class="font-bold text-2xl mb-2">Checkout</h3>
        <p class="text-base-content/70 mb-6">Total Amount Due</p>
        
        <div class="text-5xl font-bold text-primary font-mono mb-8">
            ₹{{ invoice.total_amount }}
        </div>

        <form method="POST" action="{% url 'sales:pos_checkout' %}" 
              hx-post="{% url 'sales:pos_checkout' %}" 
              hx-swap="none"
              class="space-y-4" 
              onsubmit="setTimeout(closeCheckoutModal, 300)">
            {% csrf_token %}
            
            <div class="grid grid-cols-2 md:grid-cols-3 gap-2">
                {% for pm in payment_methods %}
                <label class="cursor-pointer border border-base-300 rounded-lg p-3 hover:bg-base-200 flex flex-col items-center gap-2 has-[:checked]:border-primary has-[:checked]:bg-primary/10 transition-colors">
                    <input type="radio" name="payment_method" value="{{ pm.id }}" class="hidden" {% if forloop.first %}checked{% endif %} />
                    {% if pm.type == 'CASH' %}
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-success" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 9V7a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2m2 4h10a2 2 0 002-2v-6a2 2 0 00-2-2H9a2 2 0 00-2 2v6a2 2 0 002 2z" /></svg>
                    {% elif pm.type == 'CARD' %}
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-info" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z" /></svg>
                    {% elif pm.type == 'UPI' %}
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-secondary" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v1m6 11h2m-6 0h-2v4m0-11v3m0 0h.01M12 12h4.01M16 20h4M4 12h4m12 0h.01M5 8h2a1 1 0 001-1V5a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1zm14 0h2a1 1 0 001-1V5a1 1 0 00-1-1h-2a1 1 0 00-1 1v2a1 1 0 001 1zM5 20h2a1 1 0 001-1v-2a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1z" /></svg>
                    {% else %}
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-accent" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 14v3m4-3v3m4-3v3M3 21h18M3 10h18M3 7l9-4 9 4M4 10h16v11H4V10z" /></svg>
                    {% endif %}
                    <span class="font-bold text-[11px] text-center w-full truncate" title="{{ pm.name }}">{{ pm.name }}</span>
                </label>
                {% empty %}
                <div class="col-span-full text-sm text-error">No active payment methods configured!</div>
                {% endfor %}
            </div>

            <div class="modal-action mt-6 flex gap-2">
                <button type="button" class="btn btn-ghost flex-1" onclick="closeCheckoutModal()">Cancel</button>
                <button type="submit" class="btn btn-primary flex-1">Complete Sale</button>
            </div>
        </form>
    </div>
</dialog>

<script>
    function closeCheckoutModal() {
        const modal = document.getElementById('pos_checkout_modal');
        if (modal) {
            modal.removeAttribute('open');
            setTimeout(() => modal.remove(), 200);
        }
    }
</script>
