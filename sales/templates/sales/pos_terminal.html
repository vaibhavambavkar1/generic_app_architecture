{% extends "core/base.html" %}

{% block title %}POS Terminal | ERP Framework{% endblock %}

{% block content %}
<div class="h-[calc(100vh-8rem)] flex flex-col md:flex-row gap-4">
    <!-- Left: Scanner and Products -->
    <div class="flex-1 flex flex-col gap-4">
        <!-- Scanner Input -->
        <div class="bg-base-100 p-4 rounded-xl shadow-lg border border-primary/20 bg-gradient-to-r from-base-100 to-primary/5">
            <h2 class="text-xl font-bold mb-2 flex items-center gap-2 text-primary">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v1m6 11h2m-6 0h-2v4m0-11v3m0 0h.01M12 12h4.01M16 20h4M4 12h4m12 0h.01M5 8h2a1 1 0 001-1V5a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1zm14 0h2a1 1 0 001-1V5a1 1 0 00-1-1h-2a1 1 0 00-1 1v2a1 1 0 001 1zM5 20h2a1 1 0 001-1v-2a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1z" />
                </svg>
                Scan Barcode
            </h2>
            <form hx-post="{% url 'sales:pos_scan_barcode' %}" hx-target="#pos-cart" hx-swap="outerHTML" onsubmit="this.reset(); setTimeout(()=>document.getElementById('barcode-input').focus(), 50)">
                {% csrf_token %}
                <div class="join w-full">
                    <input type="text" id="barcode-input" name="barcode" class="input input-bordered join-item w-full text-lg font-mono placeholder:font-sans" placeholder="Ready to scan... (or type SKU)" autofocus autocomplete="off" />
                    <button type="submit" class="btn btn-primary join-item">Add Item</button>
                </div>
            </form>
            <div id="pos-alert"></div>
        </div>

        <!-- Hotkeys / Quick Actions -->
        <div class="flex-1 bg-base-100 rounded-xl shadow border border-base-200 p-4">
            <h3 class="font-bold text-base-content/70 mb-4">Quick Products</h3>
            <div class="grid grid-cols-3 gap-2">
                <!-- Ideally populated from DB based on most sold -->
                <button class="btn btn-outline border-base-300 h-24 flex flex-col" onclick="document.getElementById('barcode-input').value='PROD-100'; document.getElementById('barcode-input').form.dispatchEvent(new Event('submit', {cancelable: true, bubbles: true}))">
                    <span class="text-xs">PROD-100</span>
                    <span class="font-bold">Test Item A</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Right: Cart & Checkout -->
    <div class="w-full md:w-96 flex flex-col bg-base-100 rounded-xl shadow-lg border border-base-200 overflow-hidden">
        <div class="p-4 bg-base-200/50 border-b border-base-200 flex justify-between items-center">
            <h2 class="font-bold text-lg">Current Sale</h2>
            <span class="badge badge-primary">{{ invoice.invoice_number }}</span>
        </div>
        
        <!-- Cart Items (Replaced by HTMX) -->
        {% include "sales/partials/pos_cart.html" %}
    </div>
</div>
{% endblock %}
