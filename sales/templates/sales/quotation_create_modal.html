<dialog id="quotation_create_modal" class="modal modal-bottom sm:modal-middle" open>
    <div class="modal-box bg-base-100 border border-base-300 shadow-xl rounded-2xl max-w-lg">
        <div class="flex items-center justify-between mb-6">
            <h3 class="font-bold text-xl text-primary flex items-center gap-2">
                New Quotation
            </h3>
            <button class="btn btn-sm btn-circle btn-ghost" onclick="closeCreateModal('quotation_create_modal')">✕</button>
        </div>

        <form method="POST" action="{% url 'sales:quotation_create_modal' %}" 
              hx-post="{% url 'sales:quotation_create_modal' %}" 
              hx-swap="outerHTML"
              hx-target="#quotation_create_modal"
              class="space-y-4">
            {% csrf_token %}
            
            {% for field in form %}
            <div class="form-control w-full">
                <label class="label"><span class="label-text font-semibold">{{ field.label }}</span></label>
                {{ field }}
                {% if field.errors %}
                <div class="text-error text-xs mt-1">
                    {% for error in field.errors %}
                        {{ error }}
                    {% endfor %}
                </div>
                {% endif %}
            </div>
            {% endfor %}

            <div class="modal-action mt-6 flex gap-2">
                <button type="button" class="btn btn-ghost flex-1" onclick="closeCreateModal('quotation_create_modal')">Cancel</button>
                <button type="submit" class="btn btn-primary flex-1">Create</button>
            </div>
        </form>
    </div>
</dialog>

<script>
    if (typeof closeCreateModal !== 'function') {
        window.closeCreateModal = function(modalId) {
            const modal = document.getElementById(modalId);
            if (modal) {
                modal.removeAttribute('open');
                setTimeout(() => modal.remove(), 200);
            }
        }
    }
</script>
