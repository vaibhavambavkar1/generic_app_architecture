<dialog id="account_edit_modal" class="modal modal-bottom sm:modal-middle" open>
    <div class="modal-box bg-base-100 border border-base-300 shadow-xl rounded-2xl max-w-lg">
        <div class="flex items-center justify-between mb-6">
            <h3 class="font-bold text-xl text-primary flex items-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z" />
                </svg>
                Edit Account: {{ account.code }}
            </h3>
            <button class="btn btn-sm btn-circle btn-ghost" onclick="closeAccountEditModal()">✕</button>
        </div>

        <form method="POST" action="{% url 'finance:account_edit' account.pk %}" 
              hx-post="{% url 'finance:account_edit' account.pk %}" 
              hx-target="body"
              class="space-y-4" 
              onsubmit="setTimeout(closeAccountEditModal, 300)">
            {% csrf_token %}
            
            <div class="form-control">
                <label class="label"><span class="label-text font-semibold">Account Name</span></label>
                {{ form.name }}
            </div>
            
            <div class="form-control">
                <label class="label"><span class="label-text font-semibold">Category</span></label>
                {{ form.category }}
            </div>
            
            <div class="form-control">
                <label class="label"><span class="label-text font-semibold">Description</span></label>
                {{ form.description }}
            </div>
            
            <div class="form-control flex flex-row items-center gap-4 mt-2">
                <label class="label cursor-pointer p-0"><span class="label-text font-semibold mr-2">Active</span></label>
                {{ form.is_active }}
            </div>

            <div class="modal-action mt-6">
                <button type="button" class="btn btn-ghost" onclick="closeAccountEditModal()">Cancel</button>
                <button type="submit" class="btn btn-primary">Save Changes</button>
            </div>
        </form>
    </div>
</dialog>

<script>
    function closeAccountEditModal() {
        const modal = document.getElementById('account_edit_modal');
        if (modal) {
            modal.removeAttribute('open');
            setTimeout(() => modal.remove(), 200);
        }
    }
</script>
