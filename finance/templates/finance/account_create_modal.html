<dialog id="account_create_modal" class="modal modal-bottom sm:modal-middle" open>
    <div class="modal-box bg-base-100 border border-base-300 shadow-xl rounded-2xl max-w-lg">
        <div class="flex items-center justify-between mb-6">
            <h3 class="font-bold text-xl text-primary flex items-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6" />
                </svg>
                Create New Account
            </h3>
            <button class="btn btn-sm btn-circle btn-ghost" onclick="closeAccountCreateModal()">✕</button>
        </div>

        <form method="POST" action="{% url 'finance:account_create' %}" 
              hx-post="{% url 'finance:account_create' %}" 
              hx-target="body"
              class="space-y-4" 
              onsubmit="setTimeout(closeAccountCreateModal, 300)">
            {% csrf_token %}
            
            <div class="form-control">
                <label class="label"><span class="label-text font-semibold">Account Name</span></label>
                {{ form.name }}
            </div>
            
            <div class="form-control">
                <label class="label"><span class="label-text font-semibold">Category</span></label>
                {{ form.category }}
            </div>
            
            <div class="form-control">
                <label class="label"><span class="label-text font-semibold">Description</span></label>
                {{ form.description }}
            </div>
            
            <div class="form-control flex flex-row items-center gap-4 mt-2">
                <label class="label cursor-pointer p-0"><span class="label-text font-semibold mr-2">Active</span></label>
                {{ form.is_active }}
            </div>

            <div class="modal-action mt-6">
                <button type="button" class="btn btn-ghost" onclick="closeAccountCreateModal()">Cancel</button>
                <button type="submit" class="btn btn-primary">Create Account</button>
            </div>
        </form>
    </div>
</dialog>

<script>
    function closeAccountCreateModal() {
        const modal = document.getElementById('account_create_modal');
        if (modal) {
            modal.removeAttribute('open');
            setTimeout(() => modal.remove(), 200);
        }
    }
</script>
