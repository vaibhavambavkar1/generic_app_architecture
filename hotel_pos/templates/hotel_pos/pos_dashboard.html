<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>POS Dashboard</title>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex h-screen">
    <div class="w-2/3 p-4">
        <h1 class="text-2xl font-bold mb-4">Menu Items</h1>
        <div class="grid grid-cols-4 gap-4">
            {% for item in items %}
            <button hx-post="{% url 'hotel_pos:add_to_order' item.id %}" hx-target="#order-items" hx-swap="beforeend" class="bg-white p-4 rounded shadow hover:bg-blue-50">
                <div class="font-bold">{{ item.name }}</div>
                <div class="text-green-600">${{ item.price }}</div>
            </button>
            {% endfor %}
        </div>
    </div>
    <div class="w-1/3 bg-white border-l p-4 flex flex-col">
        <h2 class="text-xl font-bold mb-4">Current Order</h2>
        <ul id="order-items" class="flex-grow overflow-y-auto">
            <!-- Items appended here via HTMX -->
        </ul>
        <div class="mt-4 pt-4 border-t">
            <button class="w-full bg-blue-600 text-white py-3 rounded font-bold">Send to Kitchen (KOT)</button>
        </div>
    </div>
</body>
</html>
