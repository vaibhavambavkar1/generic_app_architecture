{% extends 'core/base.html' %}

{% block title %}POS Dashboard | Hotel Management{% endblock %}

{% block content %}
<div class="flex flex-col lg:flex-row gap-6 h-[calc(100vh-8rem)]">
    <!-- Menu Section -->
    <div class="w-full lg:w-2/3 bg-base-100 rounded-box shadow-lg p-6 overflow-y-auto">
        <h1 class="text-2xl font-bold mb-6">Menu Items</h1>
        <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
            {% for item in items %}
            <button hx-post="{% url 'hotel_pos:add_to_order' item.id %}" hx-target="#order-items" hx-swap="beforeend" class="btn btn-outline h-auto py-4 flex flex-col items-center justify-center gap-2 hover:bg-primary hover:border-primary hover:text-white transition-all">
                <span class="font-bold text-center leading-tight">{{ item.name }}</span>
                <span class="text-primary font-semibold text-lg">${{ item.price }}</span>
            </button>
            {% endfor %}
        </div>
    </div>
    
    <!-- Order Section -->
    <div class="w-full lg:w-1/3 bg-base-100 rounded-box shadow-lg p-6 flex flex-col h-full border border-base-200">
        <h2 class="text-xl font-bold mb-4 border-b border-base-200 pb-2">Current Order</h2>
        <ul id="order-items" class="flex-grow overflow-y-auto space-y-2">
            <!-- Items appended here via HTMX -->
        </ul>
        <div class="mt-4 pt-4 border-t border-base-200">
            <button class="btn btn-primary w-full shadow-lg">Send to Kitchen (KOT)</button>
        </div>
    </div>
</div>
{% endblock %}
