{% extends "core/base.html" %}

{% block title %}{{ title }} | ERP Framework{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto space-y-6">
    <div>
        <h1 class="text-3xl font-bold tracking-tight">{{ title }}</h1>
    </div>

    <div class="card bg-base-200 shadow">
        <div class="card-body">
            <form method="POST" class="space-y-4">
                {% csrf_token %}
                
                {% for field in form %}
                <div class="form-control w-full">
                    <label class="label">
                        <span class="label-text font-semibold">{{ field.label }}</span>
                    </label>
                    {{ field }}
                    {% if field.errors %}
                    <label class="label">
                        <span class="label-text-alt text-error">{{ field.errors|join:", " }}</span>
                    </label>
                    {% endif %}
                    {% if field.help_text %}
                    <label class="label">
                        <span class="label-text-alt text-base-content/60">{{ field.help_text }}</span>
                    </label>
                    {% endif %}
                </div>
                {% endfor %}

                <div class="card-actions justify-end mt-6">
                    <a href="javascript:history.back()" class="btn btn-ghost">Cancel</a>
                    <button type="submit" class="btn btn-primary">Save Changes</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
