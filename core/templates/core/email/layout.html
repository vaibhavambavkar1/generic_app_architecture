{% extends "core/base.html" %}

{% block title %}Internal Email | ERP Framework{% endblock %}

{% block content %}
<div class="flex flex-col md:flex-row gap-6 h-[calc(100vh-8rem)]">
    
    <!-- Sidebar -->
    <div class="w-full md:w-64 bg-base-100 rounded-2xl shadow-xl shadow-base-300/50 border border-base-200/50 p-5 shrink-0 flex flex-col h-full transition-all duration-300">
        <a href="{% url 'core:email_compose' %}" class="btn btn-primary w-full mb-6 rounded-xl hover:scale-[1.02] transition-transform shadow-lg shadow-primary/30">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" /></svg>
            Compose
        </a>
        
        <ul class="menu w-full p-0 flex-1 space-y-1">
            <li>
                <a href="{% url 'core:email_inbox' %}" class="rounded-xl transition-all duration-200 {% if active_tab == 'inbox' %}bg-primary text-primary-content font-bold shadow-md shadow-primary/20 hover:bg-primary hover:text-primary-content{% else %}hover:bg-base-200{% endif %}">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 13V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7m16 0v5a2 2 0 01-2 2H6a2 2 0 01-2-2v-5m16 0h-2.586a1 1 0 00-.707.293l-2.414 2.414a1 1 0 01-.707.293h-3.172a1 1 0 01-.707-.293l-2.414-2.414A1 1 0 006.586 13H4" /></svg>
                    Inbox
                    {% if unread_count > 0 %}
                    <span class="badge badge-sm ml-auto {% if active_tab == 'inbox' %}badge-outline border-primary-content text-primary-content{% else %}badge-error{% endif %} font-black">{{ unread_count }}</span>
                    {% endif %}
                </a>
            </li>
            <li>
                <a href="{% url 'core:email_sent' %}" class="rounded-xl transition-all duration-200 {% if active_tab == 'sent' %}bg-primary text-primary-content font-bold shadow-md shadow-primary/20 hover:bg-primary hover:text-primary-content{% else %}hover:bg-base-200{% endif %}">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8" /></svg>
                    Sent
                </a>
            </li>
        </ul>
    </div>
    
    <!-- Main Content Area -->
    <div class="flex-1 bg-base-100 rounded-2xl shadow-xl shadow-base-300/50 border border-base-200/50 overflow-hidden flex flex-col h-full relative">
        {% block email_content %}{% endblock %}
    </div>
    
</div>
{% endblock %}
