{% extends "core/email/layout.html" %}

{% block email_content %}
<div class="p-6 border-b border-base-200 bg-gradient-to-r from-base-200/50 to-base-100 flex justify-between items-center backdrop-blur-md sticky top-0 z-10">
    <h2 class="text-2xl font-black bg-clip-text text-transparent bg-gradient-to-r from-primary to-secondary">Compose Email</h2>
</div>

<div class="flex-1 overflow-y-auto p-8 bg-base-100/50">
    <form method="POST" enctype="multipart/form-data" class="max-w-4xl mx-auto space-y-6 bg-base-100 p-8 rounded-3xl shadow-xl shadow-base-300/30 border border-base-200/60">
        {% csrf_token %}
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="form-control w-full">
                <label class="label"><span class="label-text font-bold text-base-content/80 uppercase tracking-wider text-xs">To</span></label>
                <select name="recipient" class="select select-bordered w-full rounded-xl bg-base-200/30 focus:bg-base-100 transition-colors" required>
                    <option value="" disabled selected>Select Recipient</option>
                    {% for u in users %}
                    <option value="{{ u.pk }}">{{ u.get_full_name|default:u.username }} ({{ u.email }})</option>
                    {% endfor %}
                </select>
            </div>
            
            <div class="form-control w-full">
                <label class="label"><span class="label-text font-bold text-base-content/80 uppercase tracking-wider text-xs">Subject</span></label>
                <input type="text" name="subject" placeholder="What's this about?" class="input input-bordered w-full rounded-xl bg-base-200/30 focus:bg-base-100 transition-colors" required />
            </div>
        </div>
        
        <div class="form-control">
            <label class="label"><span class="label-text font-bold text-base-content/80 uppercase tracking-wider text-xs">Message</span></label>
            <textarea name="body" placeholder="Write your message here..." class="textarea textarea-bordered h-64 rounded-xl bg-base-200/30 focus:bg-base-100 transition-colors text-base p-4" required></textarea>
        </div>
        
        <div class="form-control">
            <label class="label"><span class="label-text font-bold text-base-content/80 uppercase tracking-wider text-xs">Attachments (Optional)</span></label>
            <input type="file" name="attachments" class="file-input file-input-bordered file-input-primary w-full max-w-sm rounded-xl bg-base-200/30 cursor-pointer" multiple />
        </div>
        
        <div class="pt-6 mt-4 border-t border-base-200/50 flex justify-end gap-3">
            <a href="{% url 'core:email_inbox' %}" class="btn btn-ghost rounded-xl px-6">Discard</a>
            <button type="submit" class="btn btn-primary rounded-xl px-8 shadow-lg shadow-primary/30 hover:scale-105 transition-transform">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2 transform rotate-90" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8" /></svg>
                Send Message
            </button>
        </div>
    </form>
</div>
{% endblock %}
