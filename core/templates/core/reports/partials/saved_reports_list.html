{% if toast_message %}
<div class="toast toast-top toast-end z-50">
    <div class="alert alert-{{ toast_type }}">
        <span>{{ toast_message }}</span>
    </div>
    <script>
        setTimeout(() => {
            const toast = document.querySelector('.toast');
            if (toast) toast.remove();
        }, 3000);
    </script>
</div>
{% endif %}

<div class="overflow-x-auto">
    <table class="table table-compact w-full">
        <thead>
            <tr>
                <th>Report Name</th>
                <th>Module</th>
                <th>Created At</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            {% for report in saved_reports %}
            <tr class="hover">
                <td class="font-semibold">{{ report.name }}</td>
                <td><span class="badge badge-neutral text-xs">{{ report.report_id }}</span></td>
                <td>{{ report.created_at|date:"M d, Y H:i" }}</td>
                <td>
                    <div class="flex items-center gap-2">
                        <a href="{% url 'core:execute_saved_report' report.pk %}" class="btn btn-xs btn-primary gap-1">
                            <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                            Run
                        </a>
                        <a href="{% url 'core:report_builder' %}?edit={{ report.pk }}" class="btn btn-xs btn-outline btn-info gap-1">
                            <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg>
                            Edit
                        </a>
                        <button class="btn btn-xs btn-outline btn-error gap-1"
                                hx-post="{% url 'core:delete_saved_report' report.pk %}"
                                hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'
                                hx-confirm="Are you sure you want to delete this report configuration?"
                                hx-target="#saved-reports-section">
                            <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                            Delete
                        </button>
                    </div>
                </td>
            </tr>
            {% empty %}
            <tr>
                <td colspan="4" class="text-center py-6 text-base-content/40">No saved reports found.</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
