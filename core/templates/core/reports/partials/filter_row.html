<div class="flex gap-1 items-center bg-base-300/30 p-2 rounded border border-base-300 filter-row">
    <select name="filter_field" class="select select-bordered select-xs w-1/3 text-xs" required>
        <option value="">-- Field --</option>
        {% for f_name, f_label in fields.items %}
        <option value="{{ f_name }}" {% if selected_field == f_name %}selected{% endif %}>{{ f_label }}</option>
        {% endfor %}
    </select>
    
    <select name="filter_operator" class="select select-bordered select-xs w-1/4 text-xs" required>
        <option value="eq" {% if selected_operator == "eq" %}selected{% endif %}>Equals</option>
        <option value="ne" {% if selected_operator == "ne" %}selected{% endif %}>Not Equals</option>
        <option value="gt" {% if selected_operator == "gt" %}selected{% endif %}>Greater Than</option>
        <option value="gte" {% if selected_operator == "gte" %}selected{% endif %}>Greater Than or Equal</option>
        <option value="lt" {% if selected_operator == "lt" %}selected{% endif %}>Less Than</option>
        <option value="lte" {% if selected_operator == "lte" %}selected{% endif %}>Less Than or Equal</option>
        <option value="contains" {% if selected_operator == "contains" %}selected{% endif %}>Contains</option>
    </select>
    
    <input type="text" name="filter_value" value="{{ selected_value }}" placeholder="Value" class="input input-bordered input-xs w-1/3 text-xs" required>
    
    <button type="button" class="btn btn-error btn-xs btn-square text-white" onclick="this.closest('.filter-row').remove(); document.getElementById('report-builder-form').dispatchEvent(new Event('change'))">×</button>
</div>
