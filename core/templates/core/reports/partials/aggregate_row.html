<div class="flex gap-1 items-center bg-base-300/30 p-2 rounded border border-base-300 aggregate-row">
    <select name="agg_field" class="select select-bordered select-xs w-1/3 text-xs" required>
        <option value="">-- Field --</option>
        {% for f_name, f_label in fields.items %}
        <option value="{{ f_name }}" {% if selected_field == f_name %}selected{% endif %}>{{ f_label }}</option>
        {% endfor %}
    </select>
    
    <select name="agg_function" class="select select-bordered select-xs w-1/4 text-xs" required>
        <option value="sum" {% if selected_function == "sum" %}selected{% endif %}>Sum</option>
        <option value="avg" {% if selected_function == "avg" %}selected{% endif %}>Average</option>
        <option value="min" {% if selected_function == "min" %}selected{% endif %}>Minimum</option>
        <option value="max" {% if selected_function == "max" %}selected{% endif %}>Maximum</option>
        <option value="count" {% if selected_function == "count" %}selected{% endif %}>Count</option>
    </select>
    
    <input type="text" name="agg_alias" value="{{ selected_alias }}" placeholder="Alias (e.g. sum_val)" class="input input-bordered input-xs w-1/3 text-xs" required>
    
    <button type="button" class="btn btn-error btn-xs btn-square text-white" onclick="this.closest('.aggregate-row').remove(); document.getElementById('report-builder-form').dispatchEvent(new Event('change'))">×</button>
</div>
