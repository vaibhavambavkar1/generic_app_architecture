<div id="auth-error-container" class="mb-4"></div>
<form hx-post="{% url 'core:reset_password' %}" hx-target="#password-recovery-container" hx-swap="innerHTML">
    {% csrf_token %}
    <input type="hidden" name="username" value="{{ user_obj.username }}">
    
    <div class="mb-4">
        <h3 class="text-lg font-medium text-gray-900 dark:text-white">Security Question</h3>
        <p class="text-md text-blue-600 dark:text-blue-400 font-bold mt-2">{{ user_obj.profile.security_question }}</p>
    </div>

    <div class="space-y-4">
        <div>
            <label class="block text-sm font-medium text-gray-700 dark:text-gray-300">Your Answer</label>
            <input name="security_answer" type="password" required class="mt-1 appearance-none block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm sm:text-sm dark:bg-gray-700 dark:border-gray-600 dark:text-white">
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700 dark:text-gray-300">New Password</label>
            <input name="new_password" type="password" required class="mt-1 appearance-none block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm sm:text-sm dark:bg-gray-700 dark:border-gray-600 dark:text-white">
        </div>
    </div>

    <div class="mt-6">
        <button type="submit" class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-green-600 hover:bg-green-700">
            Reset Password
        </button>
    </div>
</form>
