{% extends 'core/base.html' %}
{% block sidebar %}{% endblock %} 
{% block header %}{% endblock %}

{% block content %}
<div class="min-h-screen bg-gray-50 dark:bg-gray-900 flex flex-col justify-center py-12 sm:px-6 lg:px-8 absolute inset-0 z-50">
    <div class="sm:mx-auto sm:w-full sm:max-w-md">
        <h2 class="mt-6 text-center text-3xl font-extrabold text-gray-900 dark:text-white">
            Password Recovery
        </h2>
    </div>

    <div class="mt-8 sm:mx-auto sm:w-full sm:max-w-md">
        <div class="bg-white dark:bg-gray-800 py-8 px-4 shadow sm:rounded-lg sm:px-10" id="password-recovery-container">
            <div id="auth-error-container" class="mb-4"></div>
            
            <form hx-post="{% url 'core:forgot_password' %}" hx-target="#password-recovery-container" hx-swap="innerHTML">
                {% csrf_token %}
                <div>
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300">Enter your Username</label>
                    <input name="username" type="text" required class="mt-1 appearance-none block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm sm:text-sm dark:bg-gray-700 dark:border-gray-600 dark:text-white">
                </div>

                <div class="mt-6">
                    <button type="submit" class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-blue-600 hover:bg-blue-700">
                        Find Account
                    </button>
                </div>
            </form>
            <div class="mt-4 text-center text-sm">
                <a href="{% url 'core:login' %}" class="text-blue-600 dark:text-blue-400 hover:underline">Back to Login</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
