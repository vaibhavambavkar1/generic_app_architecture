{% load ui_tags %}
{% get_sidebar_menus as menu_items %}

<!-- Mobile Sidebar Backdrop -->
<div 
    x-show="sidebarOpen" 
    class="fixed inset-0 z-40 bg-black/50 lg:hidden transition-opacity" 
    @click="sidebarOpen = false" 
    x-transition.opacity
    style="display: none;">
</div>

<aside
    class="fixed inset-y-0 left-0 z-50 w-64 overflow-y-auto transition-transform transform bg-base-200 border-r border-base-300 lg:translate-x-0 lg:static lg:inset-0"
    :class="{'translate-x-0 ease-out': sidebarOpen, '-translate-x-full ease-in': !sidebarOpen}">
    <div class="flex items-center justify-center h-16 border-b border-base-300">
        <span class="text-xl font-black tracking-wider text-primary uppercase">ERP Framework</span>
    </div>

    <ul class="menu menu-vertical p-4 w-full gap-1">
        <li class="menu-title px-4 mt-4 text-xs uppercase tracking-wider text-base-content/50">Hotel & Restaurant</li>
        <li>
            <a href="{% url 'hotel_pos:table_dashboard' %}" class="flex items-center gap-3">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 10h16M4 14h16M4 18h16" />
                </svg>
                Table Management
            </a>
        </li>
        <li>
            <a href="{% url 'hotel_pos:kds' %}" class="flex items-center gap-3 text-secondary">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                </svg>
                Kitchen Display (KDS)
            </a>
        </li>
    </ul>
</aside>
