<div class="flex flex-col md:flex-row md:items-center md:justify-between mb-6 gap-4">
    <div class="flex-1 min-w-0">
        <h1 class="text-3xl font-extrabold tracking-tight text-base-content sm:truncate">
            {{ title }}
        </h1>
        {% if subtitle %}
        <p class="mt-1 text-sm text-base-content/75">
            {{ subtitle }}
        </p>
        {% endif %}
    </div>
    <div class="flex flex-wrap gap-2 md:mt-0">
        {{ actions|safe }}
    </div>
</div>
