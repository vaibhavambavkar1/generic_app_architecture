<header class="navbar bg-base-100 border-b border-base-200 px-6 justify-between h-16">
    <div class="flex-none">
        <button @click="sidebarOpen = true" class="btn btn-square btn-ghost lg:hidden">
            <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M4 6H20M4 12H20M4 18H11" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        </button>
    </div>

    <!-- Global Search -->
    <div class="flex-1 max-w-md mx-4 relative" x-data="{ open: false, query: '' }">
        <div class="relative w-full">
            <input 
                type="text" 
                name="q" 
                x-model="query"
                placeholder="Global search (SKU, PO, Supplier)..." 
                class="input input-bordered w-full pr-10 text-sm h-10" 
                hx-get="{% url 'core:global_search' %}" 
                hx-trigger="keyup changed delay:300ms, search" 
                hx-target="#search-results-dropdown" 
                hx-swap="innerHTML"
                @focus="open = true"
                @click.away="open = false"
            />
            <span class="absolute inset-y-0 right-0 flex items-center pr-3 pointer-events-none text-base-content/50">
                <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                </svg>
            </span>
        </div>
        <!-- Dropdown container -->
        <div 
            id="search-results-dropdown" 
            class="absolute left-0 mt-2 w-full z-50 bg-base-200 border border-base-300 shadow-xl rounded-xl overflow-hidden" 
            x-show="open && query.trim() !== ''"
            x-transition>
        </div>
    </div>

    <div class="flex-none gap-2">
        <!-- Theme Toggle Swap -->
        <label class="swap swap-rotate btn btn-ghost btn-circle text-base-content mr-2">
            <input type="checkbox" id="theme-toggle-checkbox" onclick="toggleTheme()" />
            
            <!-- sun icon -->
            <svg class="swap-on fill-current w-5 h-5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                <path d="M5.64,17l-.71.71a1,1,0,0,0,0,1.41,1,1,0,0,0,1.41,0l.71-.71A1,1,0,0,0,5.64,17ZM5,12a1,1,0,0,0-1-1H3a1,1,0,0,0,0,2H4A1,1,0,0,0,5,12Zm7-7a1,1,0,0,0,1-1V3a1,1,0,0,0-2,0V4A1,1,0,0,0,12,5ZM5.64,7.05a1,1,0,0,0,.7.29,1,1,0,0,0,.71-.29,1,1,0,0,0,0-1.41l-.71-.71A1,1,0,0,0,4.93,6.34ZM12,6a6,6,0,1,0,6,6A6,6,0,0,0,12,6Zm7.07,1.05a1,1,0,0,0-1.41,0L17,7.78a1,1,0,0,0,0,1.41,1,1,0,0,0,1.41,0l.71-.71A1,1,0,0,0,19.07,7.05ZM17,17a1,1,0,0,0,.7.29,1,1,0,0,0,.71-.29,1,1,0,0,0,0-1.41l-.71-.71a1,1,0,0,0-1.41,1.41ZM19,12a1,1,0,0,0,1-1h1a1,1,0,0,0,0,2H20A1,1,0,0,0,19,12Zm-7,7a1,1,0,0,0-1,1v1a1,1,0,0,0,2,0V20A1,1,0,0,0,12,19Z"/>
            </svg>
            
            <!-- moon icon -->
            <svg class="swap-off fill-current w-5 h-5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                <path d="M21.64,13a1,1,0,0,0-1.05-.14,8.05,8.05,0,0,1-3.37.73A8.15,8.15,0,0,1,9.08,5.49a8.59,8.59,0,0,1,.25-2A1,1,0,0,0,8,2.36,10.14,10.14,0,1,0,22,14.05,1,1,0,0,0,21.64,13Zm-9.5,6.69A8.14,8.14,0,0,1,7.08,5.22v.27A10.15,10.15,0,0,0,17.22,15.63a9.79,9.79,0,0,0,2.1-.22A8.11,8.11,0,0,1,12.14,19.7Z"/>
            </svg>
        </label>

        <!-- User Dropdown -->
        <div class="dropdown dropdown-end">
            <label tabindex="0" class="btn btn-ghost btn-circle avatar">
                <div class="w-10 rounded-full border border-base-300">
                    <img src="https://ui-avatars.com/api/?name={{ request.user.username|default:'User' }}&background=0D8ABC&color=fff" alt="avatar" />
                </div>
            </label>
            <ul tabindex="0" class="mt-3 z-[1] p-2 shadow menu menu-sm dropdown-content bg-base-100 rounded-box w-52 border border-base-200">
                <li><span class="font-bold text-primary">{{ request.user.username|default:"Guest" }}</span></li>
                <div class="divider my-1"></div>
                <li><a href="{% url 'core:profile' %}">Profile</a></li>
                <li><a href="/admin/">Django Admin</a></li>
                <li><a href="{% url 'core:logout' %}" class="text-error font-medium">Logout</a></li>
            </ul>
        </div>
    </div>
</header>

<script>
    function syncThemeCheckbox() {
        const checkbox = document.getElementById('theme-toggle-checkbox');
        if (checkbox) {
            checkbox.checked = document.documentElement.classList.contains('dark');
        }
    }

    // Run sync immediately if page is loaded
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', syncThemeCheckbox);
    } else {
        syncThemeCheckbox();
    }

    function toggleTheme() {
        const checkbox = document.getElementById('theme-toggle-checkbox');
        const setDark = checkbox ? checkbox.checked : !document.documentElement.classList.contains('dark');
        
        if (setDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.setAttribute('data-theme', 'dark');
            localStorage.setItem('color-theme', 'dark');
        } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.setAttribute('data-theme', 'light');
            localStorage.setItem('color-theme', 'light');
        }
    }
</script>
