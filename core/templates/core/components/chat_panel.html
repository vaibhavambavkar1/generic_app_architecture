<div x-data="{ 
    chatOpen: false, 
    activeTab: 'chats',
    selectedUser: null,
    message: ''
}" class="fixed bottom-6 right-6 z-[100]">
    
    <!-- Chat Bubble Button -->
    <button @click="chatOpen = !chatOpen" 
            class="btn btn-circle btn-primary btn-lg shadow-2xl relative transition-transform hover:scale-105">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z" />
        </svg>
        <!-- Dynamic Unread badge can be added via HTMX polling here -->
        <span class="badge badge-sm badge-error absolute -top-1 -right-1 border-white" style="display:none;">0</span>
    </button>

    <!-- Chat Panel Container -->
    <div x-show="chatOpen" 
         x-transition:enter="transition ease-out duration-200"
         x-transition:enter-start="opacity-0 translate-y-4 scale-95"
         x-transition:enter-end="opacity-100 translate-y-0 scale-100"
         x-transition:leave="transition ease-in duration-150"
         x-transition:leave-start="opacity-100 translate-y-0 scale-100"
         x-transition:leave-end="opacity-0 translate-y-4 scale-95"
         class="absolute bottom-20 right-0 w-80 md:w-96 bg-base-100 rounded-2xl shadow-2xl border border-base-300 flex flex-col overflow-hidden origin-bottom-right"
         style="height: 550px; display: none;">
         
         <!-- Header -->
         <div class="bg-primary text-primary-content p-4 flex justify-between items-center shadow-sm z-10">
             <div class="flex items-center gap-2">
                 <div class="avatar placeholder">
                     <div class="bg-primary-focus text-primary-content rounded-full w-8">
                         <span class="text-xs">
                             <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z" /></svg>
                         </span>
                     </div>
                 </div>
                 <h3 class="font-bold text-lg">Team Chat</h3>
             </div>
             <button @click="chatOpen = false" class="btn btn-ghost btn-xs btn-circle hover:bg-primary-focus">
                 <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" /></svg>
             </button>
         </div>

         <!-- Body (Loads dynamically via HTMX polling) -->
         <div id="chat-messages-container" 
              x-ref="chatContainer"
              hx-get="{% url 'core:chat_messages' %}" 
              hx-trigger="load, every 3s" 
              class="flex-1 overflow-y-auto bg-base-200/50 p-4 flex flex-col">
             
             <!-- Initial Loading State -->
             <div class="flex justify-center items-center h-full text-base-content/50">
                 <span class="loading loading-spinner loading-sm"></span>
             </div>
             
         </div>

         <!-- Input Area -->
         <div class="p-3 bg-base-100 border-t border-base-200">
             <form class="flex items-center gap-2" 
                   hx-post="{% url 'core:send_chat_message' %}" 
                   hx-target="#chat-messages-container" 
                   hx-swap="innerHTML" 
                   @submit="setTimeout(() => { message = ''; $refs.chatContainer.scrollTop = $refs.chatContainer.scrollHeight; }, 50)">
                 <button type="button" class="btn btn-sm btn-circle btn-ghost text-base-content/50">
                     <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.172 7l-6.586 6.586a2 2 0 102.828 2.828l6.414-6.586a4 4 0 00-5.656-5.656l-6.415 6.585a6 6 0 108.486 8.486L20.5 13" /></svg>
                 </button>
                 <input type="text" name="message" x-model="message" placeholder="Type a message..." class="input input-sm input-bordered flex-1 rounded-full focus:outline-none focus:ring-1 focus:ring-primary" autocomplete="off" />
                 <button type="submit" class="btn btn-sm btn-circle btn-primary" :disabled="!message">
                     <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 transform rotate-90" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8" /></svg>
                 </button>
             </form>
         </div>
    </div>
</div>
