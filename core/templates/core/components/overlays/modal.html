<!-- Use AlpineJS x-data to trigger this modal from a button click -->
<!-- Example trigger: <button @click="$dispatch('open-modal', 'modal-id')">Open</button> -->
<div x-data="{ open: false }" 
     x-show="open" 
     @open-modal.window="if ($event.detail === '{{ modal_id }}') open = true"
     @close-modal.window="if ($event.detail === '{{ modal_id }}') open = false"
     @keydown.escape.window="open = false"
     :class="{ 'modal-open': open }"
     class="modal modal-bottom sm:modal-middle z-50" 
     style="display: none;" 
     role="dialog" aria-modal="true">
     
    <div class="modal-box bg-white dark:bg-gray-800 shadow-2xl relative">
        <button type="button" @click="open = false" class="btn btn-sm btn-circle btn-ghost absolute right-2 top-2">✕</button>
        
        <h3 class="text-lg font-bold text-gray-900 dark:text-white">
            {{ title|default:"Modal Title" }}
        </h3>
        
        <div class="py-4 text-left">
            <!-- Injected content goes here -->
            {{ content|safe }}
        </div>
        
        <div class="modal-action">
            <button type="button" @click="open = false" class="btn btn-ghost">
                Cancel
            </button>
            {{ actions|safe }}
        </div>
    </div>
</div>
