<tr id="transition-row-{{ transition.id }}" class="bg-base-200 shadow-inner">
    <td colspan="5" class="p-0">
        <form hx-post="{% url 'core:update_approval_route' transition.id %}" 
              hx-target="#transition-row-{{ transition.id }}" 
              hx-swap="outerHTML" 
              class="flex flex-col gap-4 p-4">
            
            <div class="flex items-center justify-between mb-2">
                <div>
                    <h4 class="font-bold text-base-content">Configuring: {{ transition.name }}</h4>
                    <p class="text-xs text-base-content/60">{{ transition.from_state.name }} → {{ transition.to_state.name }}</p>
                </div>
            </div>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div class="form-control">
                    <label class="label">
                        <span class="label-text font-semibold">Guardian Object Permission (Preferred)</span>
                    </label>
                    <input type="text" name="required_permission" value="{{ route.required_permission|default:'' }}" 
                           placeholder="e.g. inventory.approve_purchaseorder" 
                           class="input input-bordered input-sm font-mono w-full" />
                    <label class="label">
                        <span class="label-text-alt text-base-content/60">If set, checks object-level perm first, then global perm.</span>
                    </label>
                </div>
                
                <div class="form-control">
                    <label class="label">
                        <span class="label-text font-semibold">Fallback Group Requirement</span>
                    </label>
                    <select name="required_group" class="select select-bordered select-sm w-full">
                        <option value="" {% if not route.required_group %}selected{% endif %}>-- No Group Required --</option>
                        {% for group in groups %}
                            <option value="{{ group.id }}" {% if route.required_group.id == group.id %}selected{% endif %}>
                                {{ group.name }}
                            </option>
                        {% endfor %}
                    </select>
                    <label class="label">
                        <span class="label-text-alt text-base-content/60">Legacy global role check if permission is omitted.</span>
                    </label>
                </div>
            </div>
            
            <div class="flex justify-end gap-2 mt-2 border-t border-base-300 pt-3">
                <button type="button" 
                        hx-get="{% url 'core:cancel_edit_transition_row' transition.id %}" 
                        hx-target="#transition-row-{{ transition.id }}" 
                        hx-swap="outerHTML" 
                        class="btn btn-sm btn-ghost">Cancel</button>
                <button type="submit" class="btn btn-sm btn-primary">Save Policies</button>
            </div>
        </form>
    </td>
</tr>
