<div id="workflow-actions-{{ instance.id }}" class="flex flex-col space-y-4 p-5 bg-white dark:bg-gray-800 rounded-xl shadow-sm border border-gray-100 dark:border-gray-700">
    <div class="flex items-center justify-between">
        <div class="flex items-center space-x-3">
            <span class="text-sm font-semibold tracking-wide text-gray-500 dark:text-gray-400 uppercase">Current Status</span>
            <span class="px-3 py-1 text-sm font-bold rounded-full bg-indigo-100 text-indigo-800 dark:bg-indigo-900/50 dark:text-indigo-300 ring-1 ring-inset ring-indigo-500/20">
                {{ instance.workflow_state.name|default:"Initial" }}
            </span>
        </div>
        
        <div class="flex space-x-2">
            {% for transition in transitions %}
            <button 
                hx-post="{% url 'core:execute_transition' app_label model_name instance.id transition.id %}"
                hx-target="#workflow-actions-{{ instance.id }}"
                hx-swap="outerHTML"
                hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'
                class="relative px-5 py-2 text-sm font-semibold text-white bg-blue-600 rounded-lg hover:bg-blue-500 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-600 focus:ring-offset-gray-900 transition-all duration-200 ease-in-out shadow-md shadow-blue-500/20 flex items-center justify-center group overflow-hidden">
                <span>{{ transition.name }}</span>
                <span class="htmx-indicator ml-2 absolute inset-y-0 right-2 flex items-center">
                    <svg class="animate-spin h-4 w-4 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path></svg>
                </span>
            </button>
            {% empty %}
            <span class="text-sm text-gray-400 dark:text-gray-500 italic">No further actions available.</span>
            {% endfor %}
        </div>
    </div>
</div>

{% if toast_message %}
<div hx-swap-oob="beforeend:body">
    {% include 'core/components/toast.html' with message=toast_message type=toast_type %}
</div>
{% endif %}
