<div id="workflow-actions-{{ instance.id }}" class="flex flex-col space-y-4 p-5 bg-base-100 rounded-xl shadow border border-base-300">
    <div class="flex items-center justify-between">
        <div class="flex items-center space-x-3">
            <span class="text-sm font-semibold tracking-wide text-base-content/70 uppercase">Current Status</span>
            <span class="badge badge-info font-bold px-3 py-1.5">
                {{ instance.workflow_state.name|default:"Initial" }}
            </span>
        </div>
        
        <div class="flex space-x-2">
            {% for transition in transitions %}
            <button 
                hx-post="{% url 'core:execute_transition' app_label model_name instance.id transition.id %}"
                hx-target="#workflow-actions-{{ instance.id }}"
                hx-swap="outerHTML"
                hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'
                class="btn btn-primary btn-sm gap-2">
                <span>{{ transition.name }}</span>
                <span class="htmx-indicator loading loading-spinner loading-xs"></span>
            </button>
            {% empty %}
            <span class="text-sm text-base-content/50 italic">No further actions available.</span>
            {% endfor %}
        </div>
    </div>
</div>

{% if toast_message %}
<div hx-swap-oob="beforeend:body">
    {% include 'core/components/toast.html' with message=toast_message type=toast_type %}
</div>
{% endif %}
