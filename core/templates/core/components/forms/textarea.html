<div class="form-control w-full {{ extra_wrapper_classes }}">
    {% if label %}
    <label class="label">
        <span class="label-text font-semibold text-base-content/85">{{ label }}</span>
    </label>
    {% endif %}
    <textarea name="{{ name }}" 
              placeholder="{{ placeholder|default:'' }}" 
              class="textarea textarea-bordered w-full h-24 {% if error %}textarea-error{% elif success %}textarea-success{% endif %} {{ extra_textarea_classes }}"
              {% if required %}required{% endif %}
              {% if disabled %}disabled{% endif %}
              {% if id %}id="{{ id }}"{% endif %}>{{ value|default:'' }}</textarea>
    {% if helper_text %}
    <label class="label">
        <span class="label-text-alt text-base-content/60">{{ helper_text }}</span>
    </label>
    {% endif %}
</div>
