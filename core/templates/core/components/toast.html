<div class="fixed bottom-5 right-5 flex items-center w-full max-w-xs p-4 space-x-3 text-gray-700 bg-white rounded-xl shadow-xl dark:text-gray-300 dark:bg-gray-800 ring-1 ring-black/5 dark:ring-white/10 z-50 transition-all duration-300 transform" 
     role="alert" 
     x-data="{ show: true }" 
     x-show="show" 
     x-transition:enter="transition ease-out duration-300"
     x-transition:enter-start="opacity-0 translate-y-4 sm:translate-y-0 sm:scale-95"
     x-transition:enter-end="opacity-100 translate-y-0 sm:scale-100"
     x-transition:leave="transition ease-in duration-200"
     x-transition:leave-start="opacity-100 translate-y-0 sm:scale-100"
     x-transition:leave-end="opacity-0 translate-y-4 sm:translate-y-0 sm:scale-95"
     x-init="setTimeout(() => show = false, 4000)">
     
    <div class="inline-flex items-center justify-center flex-shrink-0 w-10 h-10 rounded-full {% if type == 'error' %}bg-red-100 text-red-600 dark:bg-red-900/30 dark:text-red-400{% else %}bg-green-100 text-green-600 dark:bg-green-900/30 dark:text-green-400{% endif %}">
        {% if type == 'error' %}
        <svg class="w-5 h-5" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clip-rule="evenodd"/></svg>
        {% else %}
        <svg class="w-5 h-5" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"/></svg>
        {% endif %}
    </div>
    <div class="ml-3 text-sm font-medium">{{ message }}</div>
</div>
