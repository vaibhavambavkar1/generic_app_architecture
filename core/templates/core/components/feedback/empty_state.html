<div class="hero bg-base-200 rounded-xl p-8 border border-base-300">
    <div class="hero-content text-center flex-col">
        {% if icon %}
            {{ icon|safe }}
        {% else %}
            <svg class="h-16 w-16 text-base-content/40" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M20.25 7.5l-.625 10.632a2.25 2.25 0 01-2.247 2.118H6.622a2.25 2.25 0 01-2.247-2.118L3.75 7.5m8.25 3v6.75m0 0l-3-3m3 3l3-3M3.375 7.5h17.25c.621 0 1.125-.504 1.125-1.125v-1.5c0-.621-.504-1.125-1.125-1.125H3.375c-.621 0-1.125.504-1.125 1.125v1.5c0 .621.504 1.125 1.125 1.125z" />
            </svg>
        {% endif %}
        <div class="max-w-md">
            <h3 class="text-xl font-bold text-base-content">{{ title|default:"No Data Available" }}</h3>
            <p class="py-2 text-sm text-base-content/70">{{ message|default:"There are no records to display at this time." }}</p>
            {% if action_url %}
            <a href="{{ action_url }}" class="btn btn-primary btn-sm mt-4">
                {{ action_label|default:"Add New" }}
            </a>
            {% endif %}
        </div>
    </div>
</div>
