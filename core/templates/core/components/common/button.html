<button 
    {% if id %}id="{{ id }}"{% endif %}
    {% if type %}type="{{ type }}"{% else %}type="button"{% endif %}
    {% if disabled %}disabled{% endif %}
    {% if hx_post %}hx-post="{{ hx_post }}"{% endif %}
    {% if hx_get %}hx-get="{{ hx_get }}"{% endif %}
    {% if hx_target %}hx-target="{{ hx_target }}"{% endif %}
    {% if hx_swap %}hx-swap="{{ hx_swap }}"{% endif %}
    class="inline-flex items-center justify-center px-4 py-2 text-sm font-medium rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-offset-2 transition-colors disabled:opacity-50 disabled:cursor-not-allowed
    {% if variant == 'primary' or not variant %}
        text-white bg-blue-600 hover:bg-blue-700 focus:ring-blue-500 border border-transparent
    {% elif variant == 'secondary' %}
        text-blue-700 bg-blue-100 hover:bg-blue-200 focus:ring-blue-500 border border-transparent
    {% elif variant == 'danger' %}
        text-white bg-red-600 hover:bg-red-700 focus:ring-red-500 border border-transparent
    {% elif variant == 'outline' %}
        text-gray-700 bg-white hover:bg-gray-50 focus:ring-blue-500 border border-gray-300 dark:bg-gray-800 dark:text-gray-300 dark:border-gray-600 dark:hover:bg-gray-700
    {% endif %}
    {{ extra_classes|default:'' }}">
    
    {% if icon %}
        <span class="mr-2 -ml-1">{{ icon|safe }}</span>
    {% endif %}
    
    {{ text|default:"Button" }}
    
    {% if show_indicator %}
    <span class="htmx-indicator ml-2">
        <svg class="animate-spin h-4 w-4 text-current" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path></svg>
    </span>
    {% endif %}
</button>
