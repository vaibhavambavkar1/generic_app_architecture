<div class="stats shadow bg-base-100 border border-base-200 w-full hover:shadow-md transition-shadow duration-300">
    <div class="stat">
        <div class="stat-figure text-{{ color|default:'primary' }}">
            <div class="p-3 bg-{{ color|default:'primary' }}/10 rounded-lg">
                {{ icon|safe }}
            </div>
        </div>
        <div class="stat-title text-xs font-bold uppercase tracking-wider text-base-content/60">{{ title }}</div>
        <div class="stat-value text-3xl font-extrabold text-base-content my-1">{{ value|default:"0" }}</div>
        {% if description %}
        <div class="stat-desc text-base-content/70">{{ description }}</div>
        {% endif %}
    </div>
</div>
