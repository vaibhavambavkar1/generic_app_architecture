<div class="card bg-base-100 shadow-xl border border-base-200 hover:shadow-2xl transition-all duration-300">
    <div class="card-body p-6">
        <div class="flex items-center justify-between mb-4">
            <div>
                <h3 class="text-lg font-bold text-base-content">{{ title|default:"Chart" }}</h3>
                {% if subtitle %}
                <p class="text-xs text-base-content/60">{{ subtitle }}</p>
                {% endif %}
            </div>
            {% if actions %}
            <div class="flex gap-2">
                {{ actions|safe }}
            </div>
            {% endif %}
        </div>
        
        <!-- Chart Canvas Container -->
        <div class="relative w-full" style="height: {{ height|default:'300px' }};">
            {{ chart_content|safe }}
        </div>
    </div>
</div>
