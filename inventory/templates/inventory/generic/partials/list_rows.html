{% load core_tags %}
{% for obj in objects %}
<tr class="hover:bg-gray-50 dark:hover:bg-gray-700 transition-colors">
    {% for f in fields %}
    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500 dark:text-gray-400">
        {{ obj|get_attr:f }}
    </td>
    {% endfor %}
    <td class="px-6 py-4 whitespace-nowrap text-right text-sm font-medium flex justify-end space-x-2">
        <a href="{% url 'inventory:manage_update' model_name obj.pk %}" class="inline-flex items-center text-indigo-600 hover:text-indigo-900 dark:text-indigo-400 dark:hover:text-indigo-300 mr-2">
            {% icon 'edit' 'w-4 h-4 mr-1' %} Edit
        </a>
        <a href="{% url 'inventory:manage_delete' model_name obj.pk %}" class="inline-flex items-center text-red-600 hover:text-red-900 dark:text-red-400 dark:hover:text-red-300">
            {% icon 'delete' 'w-4 h-4 mr-1' %} Delete
        </a>
    </td>
</tr>
{% empty %}
<tr>
    <td colspan="100%" class="px-6 py-8 text-center text-gray-500 dark:text-gray-400">No records found.</td>
</tr>
{% endfor %}
