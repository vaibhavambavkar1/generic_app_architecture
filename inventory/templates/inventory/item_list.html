{% extends 'core/base.html' %}

{% block content %}
<div class="p-6 max-w-7xl mx-auto">
    <!-- Header & Barcode Scanner -->
    <div class="flex justify-between items-center mb-6">
        <h1 class="text-3xl font-bold text-gray-900 dark:text-white">Item Catalog</h1>
        
        <!-- Hidden Barcode Scanner Input Form -->
        <!-- Intercepts scanner input which usually sends the barcode string followed by the Enter key -->
        <form hx-post="{% url 'inventory:barcode_scan' %}" hx-target="#toast-container" hx-swap="beforeend" class="flex gap-2">
            {% csrf_token %}
            <input type="text" name="barcode" placeholder="Scan Barcode Here..." autofocus
                   class="shadow-sm focus:ring-blue-500 focus:border-blue-500 block w-64 sm:text-sm border-gray-300 rounded-md dark:bg-gray-700 dark:border-gray-600 dark:text-white"
                   autocomplete="off">
            <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded shadow">
                Scan
            </button>
        </form>
    </div>

    <!-- Toast Notification Container for Scanner Feedback -->
    <div id="toast-container" class="fixed top-5 right-5 z-50 flex flex-col gap-2"></div>

    <!-- Search Bar triggering HTMX -->
    <div class="mb-6">
        <div class="relative rounded-md shadow-sm">
            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                <svg class="h-5 w-5 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                </svg>
            </div>
            <input type="text" name="q" 
                   class="focus:ring-blue-500 focus:border-blue-500 block w-full pl-10 sm:text-sm border-gray-300 rounded-md py-3 dark:bg-gray-800 dark:border-gray-700 dark:text-white" 
                   placeholder="Search items by Name, SKU, or Barcode..."
                   hx-get="{{ search_url }}" 
                   hx-trigger="keyup changed delay:300ms, search" 
                   hx-target="#item-tbody" 
                   hx-indicator=".htmx-indicator">
        </div>
        <div class="htmx-indicator mt-2 text-sm text-blue-600 font-semibold">Searching catalog...</div>
    </div>

    <!-- Infinite Scroll Table -->
    <div class="bg-white dark:bg-gray-800 shadow overflow-hidden sm:rounded-lg">
        <table class="min-w-full divide-y divide-gray-200 dark:divide-gray-700">
            <thead class="bg-gray-50 dark:bg-gray-700">
                <tr>
                    <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-300 uppercase tracking-wider">Item Name</th>
                    <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-300 uppercase tracking-wider">SKU</th>
                    <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-300 uppercase tracking-wider">Category</th>
                    <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-300 uppercase tracking-wider">Cost Price</th>
                    <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-300 uppercase tracking-wider">Global Stock</th>
                </tr>
            </thead>
            <tbody id="item-tbody" class="bg-white dark:bg-gray-800 divide-y divide-gray-200 dark:divide-gray-700">
                {% include 'inventory/partials/item_rows.html' %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
