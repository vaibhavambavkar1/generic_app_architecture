<tr>
    <td class="px-4 py-4">
        <select name="item_id[]" required class="block w-full pl-3 pr-10 py-2 border-gray-300 focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm rounded-md dark:bg-gray-700 dark:border-gray-600 dark:text-white">
            <option value="">Select Item...</option>
            {% for i in items %}
                <option value="{{ i.id }}">{{ i.name }} ({{ i.sku }})</option>
            {% endfor %}
        </select>
    </td>
    <td class="px-4 py-4">
        <input type="number" name="quantity[]" min="1" required class="shadow-sm focus:ring-blue-500 focus:border-blue-500 block w-full sm:text-sm border-gray-300 rounded-md dark:bg-gray-700 dark:border-gray-600 dark:text-white">
    </td>
    <td class="px-4 py-4">
        <input type="number" step="0.01" name="unit_price[]" min="0" required class="shadow-sm focus:ring-blue-500 focus:border-blue-500 block w-full sm:text-sm border-gray-300 rounded-md dark:bg-gray-700 dark:border-gray-600 dark:text-white">
    </td>
    <td class="px-4 py-4 text-right">
        <button type="button" onclick="this.closest('tr').remove()" class="text-red-600 hover:text-red-900 font-bold">Remove</button>
    </td>
</tr>
