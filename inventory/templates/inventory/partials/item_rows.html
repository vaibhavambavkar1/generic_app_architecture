{% for item in page_obj %}
<tr class="hover:bg-gray-50 dark:hover:bg-gray-700 transition-colors"
    {% if forloop.last and page_obj.has_next %}
        hx-get="{{ search_url }}?page={{ page_obj.next_page_number }}&q={{ request.GET.q }}"
        hx-trigger="revealed"
        hx-swap="afterend"
    {% endif %}>
    
    <td class="px-6 py-4 whitespace-nowrap">
        <div class="flex items-center">
            <div class="text-sm font-medium text-gray-900 dark:text-white">{{ item.name }}</div>
        </div>
    </td>
    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500 dark:text-gray-400">
        {{ item.sku }}
    </td>
    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500 dark:text-gray-400">
        <span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full bg-blue-100 text-blue-800">
            {{ item.category.name|default:"Uncategorized" }}
        </span>
    </td>
    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500 dark:text-gray-400">
        ${{ item.cost_price }}
    </td>
    <td class="px-6 py-4 whitespace-nowrap text-sm font-bold {% if item.stock_quantity < item.minimum_stock_level %}text-red-600{% else %}text-green-600{% endif %}">
        {{ item.stock_quantity }} {{ item.uom.abbreviation|default:"Units" }}
    </td>
</tr>
{% empty %}
<tr>
    <td colspan="5" class="px-6 py-10 text-center text-gray-500 dark:text-gray-400">
        No items found matching your criteria.
    </td>
</tr>
{% endfor %}
