<dialog id="label_export_modal" class="modal modal-bottom sm:modal-middle" open>
    <div class="modal-box bg-base-100 border border-base-300 shadow-xl rounded-2xl max-w-lg">
        <div class="flex items-center justify-between mb-6">
            <h3 class="font-bold text-xl text-primary flex items-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z" />
                </svg>
                Print Product Labels
            </h3>
            <button class="btn btn-sm btn-circle btn-ghost" onclick="closeLabelExportModal()">✕</button>
        </div>

        <form method="POST" action="{% url 'inventory:export_labels_pdf' %}" class="space-y-6" onsubmit="setTimeout(closeLabelExportModal, 500)">
            {% csrf_token %}
            
            <div class="alert alert-info shadow-sm text-sm p-3">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" class="stroke-current shrink-0 w-5 h-5"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                <span>Generates an A4 PDF optimized for standard 3x7 sticker sheets. Leave product selection empty to export ALL active products.</span>
            </div>

            <!-- Product Selection -->
            <div class="form-control w-full">
                <label class="label font-semibold pb-1">
                    <span class="label-text">Select Products</span>
                </label>
                <select name="item_ids" class="select select-bordered w-full h-32" multiple>
                    {% for item in items %}
                        <option value="{{ item.id }}">{{ item.sku }} - {{ item.name }}</option>
                    {% endfor %}
                </select>
                <label class="label pt-1">
                    <span class="label-text-alt text-base-content/70">Hold Ctrl/Cmd to select multiple. Leave empty for all.</span>
                </label>
            </div>

            <div class="flex gap-4">
                <!-- Label Type -->
                <div class="form-control flex-1">
                    <label class="label font-semibold pb-1">
                        <span class="label-text">Label Format</span>
                    </label>
                    <select name="label_type" class="select select-bordered w-full">
                        <option value="both" selected>Barcode + QR Code</option>
                        <option value="barcode">Barcode Only</option>
                        <option value="qr">QR Code Only</option>
                    </select>
                </div>

                <!-- Copies per product -->
                <div class="form-control flex-1">
                    <label class="label font-semibold pb-1">
                        <span class="label-text">Copies Per Product</span>
                    </label>
                    <input type="number" name="copies" value="1" min="1" max="50" class="input input-bordered w-full" />
                </div>
            </div>

            <div class="modal-action">
                <button type="button" class="btn btn-ghost" onclick="closeLabelExportModal()">Cancel</button>
                <button type="submit" class="btn btn-primary gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
                    </svg>
                    Generate PDF
                </button>
            </div>
        </form>
    </div>
</dialog>

<script>
    function closeLabelExportModal() {
        const modal = document.getElementById('label_export_modal');
        if (modal) {
            modal.removeAttribute('open');
            setTimeout(() => modal.remove(), 200);
        }
    }
</script>
