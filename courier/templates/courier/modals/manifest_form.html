<h3 class="font-bold text-lg mb-4">Create New Dispatch Manifest</h3>
    
    <form hx-post="{% url 'courier:manifest_create' %}" hx-target="#modal-container">
        {% csrf_token %}
        
        <div class="space-y-4">
            {% for field in form %}
            <div class="form-control w-full">
                <label class="label">
                    <span class="label-text font-semibold">{{ field.label }}</span>
                </label>
                {{ field }}
                {% if field.errors %}
                <span class="text-error text-sm mt-1">{{ field.errors.0 }}</span>
                {% endif %}
            </div>
            {% endfor %}
        </div>

        <div class="modal-action mt-6">
            <button type="button" class="btn btn-ghost" onclick="document.getElementById('generalModal').close()">Cancel</button>
            <button type="submit" class="btn btn-primary">Create Manifest</button>
        </div>
    </form>
